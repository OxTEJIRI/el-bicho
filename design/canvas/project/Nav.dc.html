<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Bottom nav</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Anton&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<nav style="width: 390px; height: 96px; position: relative; font-family: Inter, system-ui, sans-serif; background: {{t.nav}}; border-top: 1px solid {{t.line}}; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); align-items: start; padding-top: 10px; box-sizing: border-box">
  <a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; min-height: 44px; font-size: 11px; font-weight: 700; text-decoration: none; color: {{c.home}}">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"></path></svg>Home</a>
  <a href="Relive.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; min-height: 44px; font-size: 11px; font-weight: 700; text-decoration: none; color: {{c.relive}}">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="6" y="3" width="12" height="18" rx="2"></rect><path d="M10 9l5 3-5 3z"></path></svg>Relive</a>
  <a href="Call.dc.html" aria-label="Call it" style="justify-self: center; margin-top: -30px; width: 66px; height: 66px; border-radius: 50%; background: {{t.accent}}; color: {{t.onAccent}}; border: 5px solid {{t.bg}}; display: flex; flex-direction: column; align-items: center; justify-content: center; text-decoration: none; font-family: Anton, Impact, sans-serif; font-size: 13px; letter-spacing: 1px; line-height: 1">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8"></circle><circle cx="12" cy="12" r="3"></circle></svg>CALL</a>
  <a href="Road.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; min-height: 44px; font-size: 11px; font-weight: 700; text-decoration: none; color: {{c.road}}">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20l5-6 4 3 7-10"></path><path d="M15 7h5v5"></path></svg>Road</a>
  <a href="Ask.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; min-height: 44px; font-size: 11px; font-weight: 700; text-decoration: none; color: {{c.ask}}">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"></path></svg>Ask</a>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["home","relive","call","road","ask"],"default":"home"},"theme":{"editor":"enum","options":["red","white","gold"],"default":"red"},"$preview":{"width":390,"height":96}}'>
class Component extends DCLogic {
  renderVals() {
    var T = {
      red: { bg: '#0D0506', nav: 'rgba(13,5,6,.97)', line: 'rgba(255,255,255,.14)', accent: '#E8291D', onAccent: '#FFFFFF', on: '#F5C542', off: 'rgba(255,255,255,.62)' },
      white: { bg: '#F6F3EC', nav: 'rgba(246,243,236,.98)', line: 'rgba(0,0,0,.12)', accent: '#141414', onAccent: '#FFFFFF', on: '#141414', off: 'rgba(20,20,20,.55)' },
      gold: { bg: '#071029', nav: 'rgba(7,16,41,.97)', line: 'rgba(255,255,255,.14)', accent: '#FFD100', onAccent: '#071029', on: '#FFD100', off: 'rgba(255,255,255,.62)' }
    };
    var t = T[this.props.theme] || T.red;
    var a = this.props.active || 'home';
    var c = {};
    ['home', 'relive', 'road', 'ask'].forEach(function (k) { c[k] = k === a ? t.on : t.off; });
    return { t: t, c: c };
  }
}
</script>
</body>
</html>
