<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Share card</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Anton&amp;family=Inter:wght@400;600;800&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="width: 360px; height: 640px; position: relative; overflow: hidden; background: {{t.tint}}; color: #FFFFFF; font-family: Inter, system-ui, sans-serif">
  <img src="{{t.photo}}" alt="Cristiano Ronaldo" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: {{t.pos}}; filter: grayscale(1) contrast(1.3); mix-blend-mode: multiply">
  <div style="position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,.35) 0%, rgba(0,0,0,0) 30%, rgba(0,0,0,.25) 55%, rgba(0,0,0,.9) 100%)"></div>
  <div style="position: relative; height: 100%; display: flex; flex-direction: column; padding: 26px 22px; box-sizing: border-box">
    <div style="display: flex; justify-content: space-between; align-items: center">
      <div style="font-family: Anton, Impact, sans-serif; font-size: 22px; letter-spacing: 2px">EL BICHO</div>
      <div style="font-size: 11px; font-weight: 800; letter-spacing: 1.6px; background: {{t.accent}}; color: {{t.onAccent}}; border-radius: 6px; padding: 5px 8px">ROAD TO 1,000</div>
    </div>
    <div style="margin-top: auto">
      <div style="font-size: 13px; font-weight: 800; letter-spacing: 2px; color: {{t.accent2}}">I CALLED IT</div>
      <div style="font-family: Anton, Impact, sans-serif; font-size: 112px; line-height: .85; margin-top: 6px">#986</div>
      <div style="font-family: Anton, Impact, sans-serif; font-size: 28px; line-height: 1.05; margin-top: 8px">[HOW] · [HALF]<br>LOCKED [X] DAYS EARLY</div>
      <div style="display: flex; justify-content: space-between; align-items: flex-end; margin-top: 18px; padding-top: 14px; border-top: 1px solid rgba(255,255,255,.3)">
        <div style="font-size: 12px; line-height: 1.4">[@handle]<br><span style="opacity: .75">Proof on Sui · [checkpoint]</span></div>
        <div style="font-size: 12px; font-weight: 800; text-align: right">Call the next one<br><span style="color: {{t.accent2}}">[elbicho link]</span></div>
      </div>
      <div style="font-size: 9px; opacity: .6; margin-top: 10px">Photo: {{t.credit}}</div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["red","white","gold"],"default":"red","section":"Look"},"$preview":{"width":360,"height":640}}'>
class Component extends DCLogic {
  renderVals() {
    var T = {
      red: { tint: '#B5150C', accent: '#FFFFFF', accent2: '#F5C542', onAccent: '#B5150C', photo: '/_blob/d72988f21b2d1c77f2b6a19a9b3959bf', pos: 'center 15%', credit: 'Анна Нэсси, CC BY-SA 3.0' },
      white: { tint: '#D9CCAA', accent: '#141414', accent2: '#F5DB8B', onAccent: '#FFFFFF', photo: '/_blob/725726687a43b39d43fcc110a237ba7a', pos: 'center 25%', credit: 'KANO PHOTO, CC BY-SA 2.0' },
      gold: { tint: '#203A8A', accent: '#FFD100', accent2: '#FFD100', onAccent: '#071029', photo: '/_blob/3e54b3899f325766af27840538cd5f18', pos: 'center 10%', credit: 'Mehrdad Esfahani / Mehr News, attribution licence' }
    };
    return { t: T[this.props.theme] || T.red };
  }
}
</script>
</body>
</html>
