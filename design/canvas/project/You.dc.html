<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>You and themes</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Anton&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit}a:hover{opacity:.85}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: {{t.bg}}; color: {{t.ink}}; font-family: Inter, system-ui, sans-serif; transition: background .3s">
  <div style="height: 100%; display: flex; flex-direction: column">
    <div style="padding: 54px 20px 0; display: flex; align-items: center; gap: 14px">
      <div style="width: 64px; height: 64px; border-radius: 50%; border: 3px solid {{t.accent}}; background: {{t.card}}; display: flex; align-items: center; justify-content: center; font-family: Anton, Impact, sans-serif; font-size: 24px">TJ</div>
      <div style="flex: 1">
        <div style="font-weight: 700; font-size: 20px">[your handle]</div>
        <div style="font-size: 13px; color: {{t.sub}}">First team · 1,240 XP · 6-matchday streak</div>
      </div>
    </div>

    <div style="margin: 18px 16px 0; background: {{t.accent}}; color: {{t.onAccent}}; border-radius: 20px; padding: 16px">
      <div style="font-size: 11px; font-weight: 700; letter-spacing: 1.4px; opacity: .85">YOUR RONALDO · LEARNED FROM 37 REACTIONS</div>
      <div style="font-family: Anton, Impact, sans-serif; font-size: 26px; line-height: 1.05; margin-top: 6px">Madrid era. Big nights. Free kicks.</div>
      <div style="font-size: 13px; margin-top: 6px; opacity: .9">Changes as you react. Saved on Walrus, so it follows you to any device or AI.</div>
    </div>

    <div style="padding: 18px 20px 8px; font-size: 11px; font-weight: 700; letter-spacing: 1.4px; color: {{t.sub}}">PICK YOUR KIT</div>
    <div style="padding: 0 16px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
      <sc-for list="{{kits}}" as="k" hint-placeholder-count="3">
        <button onClick="{{k.pick}}" aria-pressed="{{k.on}}" style="padding: 0; border-radius: 18px; border: {{k.ring}}; background: {{k.bg}}; cursor: pointer; overflow: hidden; display: flex; flex-direction: column; text-align: left">
          <img src="{{k.photo}}" alt="{{k.alt}}" style="width: 100%; height: 132px; object-fit: cover; object-position: {{k.pos}}; display: block">
          <span style="padding: 8px 10px 10px; color: {{k.ink}}; font: 700 13px Inter, sans-serif">{{k.label}}<br><span style="font-weight: 500; font-size: 11px; opacity: .75">{{k.sub}}</span></span>
        </button>
      </sc-for>
    </div>

    <div style="padding: 18px 20px 8px; font-size: 11px; font-weight: 700; letter-spacing: 1.4px; color: {{t.sub}}">BADGES</div>
    <div style="padding: 0 16px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px">
      <div style="aspect-ratio: 1; border-radius: 16px; background: {{t.card}}; border: 1px solid {{t.line}}; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; font-size: 11px; font-weight: 600; gap: 4px"><span style="font-family: Anton, Impact, sans-serif; font-size: 20px; color: {{t.accent2}}">3/5</span>Calls right</div>
      <div style="aspect-ratio: 1; border-radius: 16px; background: {{t.card}}; border: 1px solid {{t.line}}; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; font-size: 11px; font-weight: 600; gap: 4px"><span style="font-family: Anton, Impact, sans-serif; font-size: 20px; color: {{t.accent2}}">12</span>Memories</div>
      <div style="aspect-ratio: 1; border-radius: 16px; background: {{t.card}}; border: 1px solid {{t.line}}; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; font-size: 11px; font-weight: 600; gap: 4px"><span style="font-family: Anton, Impact, sans-serif; font-size: 20px; color: {{t.accent2}}">6</span>Streak</div>
      <div style="aspect-ratio: 1; border-radius: 16px; border: 1px dashed {{t.line}}; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; font-size: 11px; font-weight: 600; gap: 4px; color: {{t.sub}}"><span style="font-family: Anton, Impact, sans-serif; font-size: 20px">1000</span>I called it</div>
    </div>

    <div style="margin-top: auto">
      <dc-import name="Nav" active="none" theme="{{key}}" hint-size="390px,96px"></dc-import>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["red","white","gold"],"default":"red","section":"Look"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { theme: null }; }
  renderVals() {
    var T = {
      red: { label: 'Red', sub: 'Portugal · default', alt: 'Ronaldo in the red Portugal shirt', bg: '#0D0506', ink: '#FFFFFF', sub2: 'rgba(255,255,255,.74)', accent: '#E8291D', accent2: '#F5C542', onAccent: '#FFFFFF', card: 'rgba(255,255,255,.07)', nav: 'rgba(13,5,6,.97)', line: 'rgba(255,255,255,.14)', photo: '/_blob/d72988f21b2d1c77f2b6a19a9b3959bf', pos: 'center 15%', tile: '#1C0B0C', tileInk: '#FFFFFF' },
      white: { label: 'White', sub: 'Real Madrid', alt: 'Ronaldo in the white Real Madrid shirt', bg: '#F6F3EC', ink: '#141414', sub2: 'rgba(20,20,20,.70)', accent: '#141414', accent2: '#8C6A12', onAccent: '#FFFFFF', card: '#FFFFFF', nav: 'rgba(246,243,236,.97)', line: 'rgba(0,0,0,.12)', photo: '/_blob/725726687a43b39d43fcc110a237ba7a', pos: 'center 20%', tile: '#FFFFFF', tileInk: '#141414' },
      gold: { label: 'Gold', sub: 'Al Nassr', alt: 'Ronaldo in the Al Nassr shirt', bg: '#071029', ink: '#FFFFFF', sub2: 'rgba(255,255,255,.74)', accent: '#FFD100', accent2: '#FFD100', onAccent: '#071029', card: 'rgba(255,255,255,.08)', nav: 'rgba(7,16,41,.97)', line: 'rgba(255,255,255,.14)', photo: '/_blob/3e54b3899f325766af27840538cd5f18', pos: 'center 10%', tile: '#0E1A3A', tileInk: '#FFFFFF' }
    };
    var key = this.state.theme || this.props.theme || 'red';
    var c = T[key] || T.red;
    var t = { bg: c.bg, ink: c.ink, sub: c.sub2, accent: c.accent, accent2: c.accent2, onAccent: c.onAccent, card: c.card, nav: c.nav, line: c.line };
    var self = this;
    var kits = ['red', 'white', 'gold'].map(function (k) {
      var x = T[k]; var on = k === key;
      return { label: x.label, sub: x.sub, alt: x.alt, photo: x.photo, pos: x.pos, bg: x.tile, ink: x.tileInk, on: on ? 'true' : 'false',
        ring: on ? '3px solid ' + c.accent2 : '1px solid ' + c.line, pick: function () { self.setState({ theme: k }); } };
    });
    return { key: key, t: t, kits: kits };
  }
}
</script>
</body>
</html>
